<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Palm Master - AI 손금 전문가</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-light: #c4b5fd;
            --bg-mystic: #12122b;
            --card-glass: rgba(30, 30, 60, 0.7);
            --text-gold: #fbbf24;
            --text-white: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: var(--text-white);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            padding: 3rem 1rem;
        }

        h1 {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 3.5rem;
            color: var(--text-gold);
            margin: 0;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--primary-light);
            margin-top: 1rem;
            letter-spacing: 2px;
        }

        .main-container {
            width: 90%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding-bottom: 5rem;
        }

        .upload-section {
            background: var(--card-glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .drop-zone {
            border: 2px dashed var(--primary);
            border-radius: 1.5rem;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .drop-zone:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: var(--text-gold);
        }

        .btn-read {
            margin-top: 2rem;
            background: linear-gradient(135deg, var(--primary) 0%, #6d28d9 100%);
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
            transition: transform 0.2s;
        }

        .btn-read:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.5);
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .results-grid { grid-template-columns: 1fr; }
        }

        .visual-card {
            background: var(--card-glass);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .visual-card h3 {
            color: var(--primary-light);
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        .visual-card img {
            width: 100%;
            border-radius: 1rem;
            display: block;
        }

        .fortune-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .fortune-card {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--text-gold);
            padding: 1.5rem;
            border-radius: 0 1rem 1rem 0;
            animation: fadeIn 0.8s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .fortune-card h4 {
            margin: 0;
            color: var(--text-gold);
            font-size: 1.2rem;
        }

        .fortune-card p {
            margin: 0.5rem 0 0 0;
            line-height: 1.6;
            color: var(--text-white);
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .star {
            width: 50px;
            height: 50px;
            background: var(--text-gold);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loader">
        <div class="star"></div>
        <p style="margin-top: 2rem; color: var(--text-gold);">운명의 실타래를 분석 중입니다...</p>
    </div>

    <div class="header">
        <h1>AI Palm Master</h1>
        <div class="subtitle">신비로운 AI 기술로 보는 당신의 손금 테라피</div>
    </div>

    <div class="main-container">
        <div class="upload-section">
            <form id="palm-form" action="/palm-read" method="post" enctype="multipart/form-data">
                <div class="drop-zone" onclick="document.getElementById('file-input').click()">
                    <span style="font-size: 3rem;">✋</span>
                    <p>손바닥 사진을 이곳에 올리거나 클릭하세요</p>
                    <input type="file" id="file-input" name="file" accept="image/*" style="display: none;" onchange="updateName()">
                    <div id="file-name" style="color: var(--text-gold); font-weight: bold;"></div>
                </div>
                <button type="submit" class="btn-read" onclick="showLoader()">운세 분석 시작</button>
            </form>
        </div>

        {% if analyzed %}
        <div class="results-grid">
            <div class="visual-card">
                <h3>분석된 손금</h3>
                <img src="data:image/jpeg;base64,{{ result_image }}" alt="Analyzed Palm">
                <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 10px;">빨강: 생명선 | 초록: 두뇌선 | 파랑: 감정선</p>
            </div>
            
            <div class="fortune-container">
                {% for fortune in fortunes %}
                <div class="fortune-card" style="animation-delay: {{ loop.index0 * 0.3 }}s">
                    <h4>✨ {{ fortune.category }}</h4>
                    <p>{{ fortune.text }}</p>
                </div>
                {% endfor %}
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 2rem;">
            <button class="btn-read" style="background: var(--card-glass); border: 1px solid var(--primary);" onclick="location.href='/palm'">다시 보기</button>
        </div>
        {% endif %}
    </div>

    <script>
        function updateName() {
            const input = document.getElementById('file-input');
            const display = document.getElementById('file-name');
            if (input.files.length > 0) {
                display.textContent = "선택됨: " + input.files[0].name;
            }
        }

        function showLoader() {
            if (document.getElementById('file-input').files.length > 0) {
                document.getElementById('loader').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
